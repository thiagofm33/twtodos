<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="bg-primary text-white text-center py-4">
        <h1>My Todo App</h1>
    </header>
    <main class="container mt-5 pb-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <!-- Add Todo Form -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Add New Todo</h5>
                        <form id="todoForm">
                            <div class="input-group">
                                <input 
                                    type="text" 
                                    id="todoInput" 
                                    class="form-control" 
                                    placeholder="Enter a new todo (min 3 chars, starts with capital letter)"
                                    autocomplete="off"
                                >
                                <button type="submit" class="btn btn-primary">Add</button>
                            </div>
                            <small id="errorMessage" class="text-danger d-block mt-2"></small>
                        </form>
                    </div>
                </div>

                <!-- Todo List -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Todos</h5>
                        <ul id="todoList" class="list-group">
                            <li class="list-group-item text-muted text-center">No todos yet. Add one to get started!</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2026 Todo App</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
